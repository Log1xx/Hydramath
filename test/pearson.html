<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pearson-style player test</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; margin: 0; background: #f3f3f3; color: #222; }
    .bar { padding: 10px 24px; background: #1d3b5a; color: #fff; font-weight: 600; }
    iframe { display: block; width: 100%; height: 520px; border: 0; background: #fff; }
  </style>
  <script src="mock-chrome.js"></script>
  <script>
    // The "model": picks question paragraphs and fields out of the snapshot text.
    window.__mockSolve = (snap) => {
      const tagsWhere = (re) => [...snap.matchAll(/¶([\w-]+) ([^\n]*)/g)].filter((m) => re.test(m[2])).map((m) => m[1]);
      const ids = [...snap.matchAll(/\[\[(?:INPUT|SELECT|CHOICE|MATHFIELD) id=([\w-]+)/g)].map((m) => m[1]);
      const mathfields = [...snap.matchAll(/\[\[MATHFIELD id=([\w-]+)/g)].map((m) => m[1]);
      const choices = [...snap.matchAll(/\[\[CHOICE id=([\w-]+)/g)].map((m) => m[1]);
      window.__mockIds = ids;
      return [
        {
          question: "Partial sum of Σ 11/(n(n+1))",
          question_refs: tagsWhere(/partial sum of the series|StartFraction 11 Over 1/),
          answer: "S_n = 11 − 11/(n+1)",
          steps: "Telescoping: 11/k − 11/(k+1).",
          fills: [{ id: mathfields[0], value: "11-11/(n+1)" }],
        },
        {
          question: "Does the series converge? If so, to what?",
          question_refs: tagsWhere(/converge or diverge/),
          answer: "A. Converges to 11",
          steps: "S_n → 11 as n → ∞.",
          fills: [{ id: choices[0], value: "true" }, { id: mathfields[1], value: "11" }],
        },
      ];
    };
  </script>
</head>
<body>
  <div class="bar">Player.aspx · Homework 9.2</div>
  <iframe src="pearson-frame.html" title="Question"></iframe>
  <script src="../extension/keys.js"></script><script src="../extension/content.js"></script>
</body>
</html>
